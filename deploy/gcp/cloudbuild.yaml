# One-shot build + deploy of the backend and both frontends to Cloud Run.
# Run from the repo root with: gcloud builds submit --config deploy/gcp/cloudbuild.yaml
# (deploy/gcp/deploy.sh wraps this and fills in the substitutions.)

substitutions:
  _REGION: europe-west6 # Zürich
  _AR_REPO: pr-bank # Artifact Registry repository
  _ACCOUNT_SERVICE: account-service
  _WEB: web
  _ADMIN: admin
  # Backend OIDC config. Override with your identity provider's values.
  _OIDC_JWKS_URL: ''
  _OIDC_ISSUER: ''
  _OIDC_AUDIENCE: customer-api

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_ACCOUNT_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_WEB}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_ADMIN}:$SHORT_SHA

steps:
  # --- Build images (frontends build in parallel with the backend) ---
  - id: build-account-service
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/account-service/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_ACCOUNT_SERVICE}:$SHORT_SHA
      - .
    waitFor: ['-']

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_WEB}:$SHORT_SHA
      - .
    waitFor: ['-']

  - id: build-admin
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/admin/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_ADMIN}:$SHORT_SHA
      - .
    waitFor: ['-']

  # --- Deploy to Cloud Run ---
  - id: deploy-account-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_ACCOUNT_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_ACCOUNT_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      # Internal service: no unauthenticated public ingress.
      - --no-allow-unauthenticated
      - --port=8080
      - --set-env-vars=OIDC_JWKS_URL=${_OIDC_JWKS_URL},OIDC_ISSUER=${_OIDC_ISSUER},OIDC_AUDIENCE=${_OIDC_AUDIENCE}
    waitFor: ['build-account-service']

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_WEB}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
    waitFor: ['build-web']

  - id: deploy-admin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_ADMIN}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_ADMIN}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      # Admin portal is internal: restrict ingress; front it with IAP in production.
      - --no-allow-unauthenticated
      - --port=8080
    waitFor: ['build-admin']
