# gadgetsite storefront/admin/API checks (gadgetsite/docs/superpowers/specs, §11).
name: gadgetsite

on:
  push:
    branches: [main, 'release/**']
    paths: ['gadgetsite/**', '.github/workflows/gadgetsite.yml']
  pull_request:
    paths: ['gadgetsite/**', '.github/workflows/gadgetsite.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gadgetsite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gadgetsite
    env:
      DATABASE_URL: postgresql://gadgetsite:gadgetsite@localhost:5432/gadgetsite
      TEST_DATABASE_URL: postgresql://gadgetsite:gadgetsite@localhost:5432/gadgetsite_test
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gadgetsite
          POSTGRES_USER: gadgetsite
          POSTGRES_PASSWORD: gadgetsite
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gadgetsite" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gadgetsite/package-lock.json
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests (PostgreSQL)
        run: npm run test:integration
      - name: Build
        run: npm run build
