# /etc/nginx/sites-available/vm-panel  (replace yourdomain.com)
server {
  listen 80; server_name panel.yourdomain.com;
  client_max_body_size 30m;
  location / { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
# Customer's own app on the main domain (change 8080 to the port their app runs on)
server {
  listen 80; server_name yourdomain.com www.yourdomain.com;
  location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
