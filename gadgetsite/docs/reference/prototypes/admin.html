<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gadgetsite — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#23201d;--pn:#2e2a26;--ln:#433c33;--sand:#d2a679;--tx:#f4ede5;--mut:#a89d90;--ok:#2fb35a;--bad:#e5484d;font-family:Outfit,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-size:14px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes sh{to{background-position:-200% 0}}@keyframes gw{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes pop{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:#1b1815;border-right:1px solid var(--ln);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;transition:transform .3s}
.brand{font:800 22px Georgia,serif;padding:6px 10px 16px}.brand small{display:block;font:400 11px Outfit;color:var(--mut)}
.gh{font-size:10px;letter-spacing:1.5px;color:var(--mut);padding:14px 10px 6px;text-transform:uppercase}
.ni{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;color:#d9d0c5;position:relative;transition:background .2s,padding-left .2s}
.ni:hover{background:#2a251f;padding-left:14px}.ni.on{background:#3b3025;color:var(--sand)}.ni.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--sand);animation:gw .3s}
.ni i{font-style:normal;width:18px;text-align:center}
.mn{min-width:0}.tp{display:flex;gap:12px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:#23201dee;backdrop-filter:blur(8px);z-index:5}
.tp input{flex:1;max-width:380px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;color:var(--tx)}
.bu{display:none}.av{width:34px;height:34px;border-radius:50%;background:var(--sand);color:#14181b;display:grid;place-items:center;font-weight:700}
main{padding:24px;max-width:1280px;animation:up .35s}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 18px}h3{margin:0 0 12px;font-size:15px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px;overflow:auto}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:1fr 1fr}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:20;width:250px;transform:translateX(-100%)}aside.o{transform:none}.bu{display:block}.g2{grid-template-columns:1fr}.tp{padding:12px}}
.st b{font-size:28px;display:block}.st span{color:var(--mut);font-size:12px}.st{animation:up .5s both;animation-delay:calc(var(--i)*70ms)}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px}.bars div{flex:1;background:linear-gradient(var(--sand),#8a5a22);border-radius:6px 6px 0 0;transform-origin:bottom;animation:gw .7s both;animation-delay:calc(var(--i)*80ms);position:relative}.bars div:hover{filter:brightness(1.2)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:8px}td{padding:10px 8px;border-top:1px solid var(--ln)}tr[style]{animation:up .4s both;animation-delay:calc(var(--i)*40ms)}tr:hover td{background:#35302a}
.b{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:7px 14px;cursor:pointer;font:inherit;transition:transform .15s,background .2s}.b:hover{background:#3b3328;transform:translateY(-1px)}.b:active{transform:scale(.97)}.b.p{background:var(--sand);color:#14181b;border:0;font-weight:600}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.q,input,select,textarea{background:#1b1815;border:1px solid var(--ln);border-radius:9px;padding:9px 11px;color:var(--tx);font:inherit;width:100%}.bar .q{max-width:300px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sand);outline-offset:0}input[type=range]{padding:0}input[type=color]{padding:2px;height:38px}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
.ch{padding:3px 10px;border-radius:99px;font-size:11px;background:#3b3025;color:var(--sand)}.ch.ok{background:#173a25;color:#5be08a}.ch.bad{background:#40181a;color:#ff7b80}
.tg{display:inline-block;width:40px;height:22px;border-radius:99px;background:#4a4238;position:relative;cursor:pointer;transition:background .25s;flex:none}.tg::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s}.tg.on{background:var(--ok)}.tg.on::after{transform:translateX(18px)}
.li{display:flex;gap:10px;align-items:center;background:#1b1815;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:grab;transition:transform .2s,opacity .2s,border-color .2s}.li:hover{border-color:var(--sand)}.li.dg{opacity:.4;transform:scale(.98)}.li input{background:none;border:0;padding:4px}.li .h{color:var(--mut)}.li .x{margin-left:auto;cursor:pointer;color:var(--bad)}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#272320;border-left:1px solid var(--ln);padding:22px;z-index:30;transform:translateX(100%);transition:transform .35s cubic-bezier(.22,.8,.2,1);overflow:auto;box-shadow:-20px 0 40px #0008}.dr.o{transform:none}
#ts{position:fixed;bottom:20px;right:20px;z-index:40;display:grid;gap:8px}.ts{background:var(--ok);color:#fff;padding:11px 18px;border-radius:10px;animation:pop .3s;box-shadow:0 8px 24px #0006}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#2e2a26,#463e34,#2e2a26);background-size:200% 100%;animation:sh 1.2s infinite;margin:8px 0}
.lg{width:70px;height:70px;border-radius:12px;border:1px dashed var(--sand);display:grid;place-items:center;overflow:hidden;color:var(--sand)}.lg img{width:100%;height:100%;object-fit:contain}
.dm{height:48px;background:#1b1815;border-radius:10px;overflow:hidden;margin-top:10px}.dm div{height:100%;width:60%;border-radius:10px;background:linear-gradient(90deg,#8a4b0e,var(--sand));transform:translateX(0)}
.ed{min-height:200px;background:#1b1815;border:1px solid var(--ln);border-radius:10px;padding:12px;line-height:1.7}.tb{display:flex;gap:6px;margin-bottom:8px}.tb button{width:34px}
.mx td,.mx th{text-align:center}.sp{display:grid;grid-template-columns:200px 1fr;gap:16px}@media(max-width:900px){.sp{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app"><aside id="sb"></aside><div class="mn"><header class="tp"><button class="b bu" onclick="sb.classList.toggle('o')">☰</button><input placeholder="Search products, orders, pages… (Ctrl K)" id="gs"><span style="flex:1"></span><button class="b" id="pv">Preview site ↗</button><button class="b p" id="pb">Publish <span id="pc" class="ch" style="color:#14181b;background:#fff3">0</span></button><span class="av">A</span></header><main id="v"></main></div></div>
<div class="dr" id="dr"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const NAV=[['Overview',[['dash','Dashboard','◧']]],['Storefront',[['site','Site identity & motion','✦'],['home','Home builder','▤'],['ban','Banners & ribbon','▭'],['menu','Menus & footer','☰'],['pages','Pages & policies','✎']]],['Catalog',[['prod','Products & variants','▣'],['cat','Categories & mega menu','⌗'],['brand','Brands','◎']]],['Sales',[['ord','Orders & refunds','🧾'],['emi','EMI & payments','৳'],['promo','Promotions','%'],['inbox','Inbox & pre-orders','✉'],['pay','Payment gateways','💳'],['ship','Shipping & couriers','🚚']]],['System',[['users','Roles & audit log','🔒'],['set','Settings','⚙']]]];
const D={prod:{c:['Product','Brand','Offer ৳','Stock','Status'],r:[['iPhone 18 Pro Max','Apple','185,990',12,'Active'],['iPhone 18 Pro','Apple','167,990',8,'Active'],['Galaxy S26 Ultra','Samsung','113,990',0,'Hidden'],['OnePlus 15 5G','OnePlus','89,888',4,'Active']],e:'Variants (colour · storage · region), care plans, add-ons, badges, SEO, FAQ and gallery open in the edit form.'},
ord:{c:['Order','Customer','Total ৳','Payment','Status'],r:[['#10482','Rahim','185,990','bKash','Shipped'],['#10481','Nusrat','24,990','COD','Placed'],['#10480','Imran','89,888','EMI 12m','Refund requested']]},
promo:{c:['Campaign','Type','Starts','Ends','Status'],r:[['Mega Sale 70%','Sale','Oct 8','Oct 20','Active'],['Flash Sale','Countdown','Today','23:00','Active'],['Free Care+','Gift','Oct 1','Oct 31','Active']]},
inbox:{c:['From','Subject','Type','Date','Status'],r:[['Karim','Pixel 10 Pro request','Pre-order','Oct 8','New'],['Sadia','Warranty question','Chat','Oct 7','Open']]},
cat:{c:['Category','Mega layout','Items','Sort','Status'],r:[['Phones','3 columns',19,1,'Active'],['Laptop','2 columns',13,3,'Active'],['Accessories','6 columns',42,6,'Active'],['Monitor','1 column',6,10,'Active']]},
brand:{c:['Brand','Logo','Products','Letter','Status'],r:[['Apple','apple.svg',120,'A','Active'],['Samsung','samsung.svg',95,'S','Active'],['Fastrack','fastrack.png',14,'F','Active']]}};
const titles={dash:['Dashboard','Live overview of the store'],site:['Site identity & motion','Name, logo, theme colours and animation timings'],home:['Home builder','Drag to reorder, toggle, schedule'],ban:['Banners & ribbon','Hero slides, promo banners and ribbon messages'],menu:['Menus & footer','Header links, menu row, footer columns, branches'],pages:['Pages & policies','Rich text in English and Bangla'],prod:['Products & variants','Prices, stock, badges, care plans'],cat:['Categories & mega menu','Tree, layout and brand tiles'],brand:['Brands','Logos and A–Z'],ord:['Orders & refunds','Status flow and SLA'],emi:['EMI & payments','Bank rates by tenure'],promo:['Promotions','Flash sales, coupons, gifts'],inbox:['Inbox & pre-orders','Messages and requests'],users:['Roles & audit log','Permissions and history'],set:['Settings','Payments, delivery, maintenance']};
titles.pay=['Payment gateways','bKash, Nagad, SSLCommerz and more — credentials, mode, fees, COD rules'];titles.ship=['Shipping & couriers','Pathao, Steadfast, RedX… rules, booking, COD settlement'];
let pend=0,cur='dash';const AL=[];
const audit=a=>{AL.unshift([new Date().toLocaleTimeString(),'admin',a]);pend++;$('#pc').textContent=pend};
const toast=m=>{const t=document.createElement('div');t.className='ts';t.textContent=m;$('#ts').append(t);setTimeout(()=>t.remove(),2600)};
const tg=o=>`<span class="tg ${o?'on':''}" onclick="this.classList.toggle('on');audit('Toggled setting')"></span>`;
const chip=s=>`<span class="ch ${/Active|Shipped|Open|New/.test(s)?'ok':/Hidden|Refund/.test(s)?'bad':''}">${s}</span>`;
const lst=(a,t=1)=>`<div class="sort">${a.map(x=>`<div class="li" draggable="true"><span class="h">⠿</span><input value="${x}" onchange="audit('Edited list item')">${t?tg(1):''}<span class="x" onclick="this.parentNode.remove();audit('Removed item')">✕</span></div>`).join('')}</div><button class="b" onclick="addI(this)">+ Add</button>`;
function addI(b){const s=b.previousElementSibling;s.insertAdjacentHTML('beforeend',s.firstChild.outerHTML.replace(/value="[^"]*"/,'value="New item"'));audit('Added item');dnd()}
function dnd(){$$('.sort').forEach(s=>{s.ondragstart=e=>e.target.classList.add('dg');s.ondragend=e=>{e.target.classList.remove('dg');audit('Reordered')};s.ondragover=e=>{e.preventDefault();const d=s.querySelector('.dg');if(!d)return;const a=[...s.children].find(c=>c!==d&&e.clientY<c.getBoundingClientRect().top+c.offsetHeight/2);s.insertBefore(d,a||null)}})}
function tbl(k){const d=D[k];return `<div class="bar"><input class="q" placeholder="Filter…" oninput="$$('#tb tr[style]').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(this.value.toLowerCase()))"><button class="b p" onclick="edit('${k}',-1)">+ Add new</button><button class="b">Import CSV</button><button class="b">Export</button></div>${d.e?`<p class="sub">${d.e}</p>`:''}<div class="card"><table id="tb"><tr>${d.c.map(c=>`<th>${c}</th>`).join('')}<th></th></tr>${d.r.map((r,i)=>`<tr style="--i:${i}">${r.map((x,j)=>`<td>${j==r.length-1?chip(x):x}</td>`).join('')}<td><button class="b" onclick="edit('${k}',${i})">Edit</button></td></tr>`).join('')}</table></div>`}
function edit(k,i){const d=D[k],r=i<0?d.c.map(()=>''):d.r[i];$('#dr').innerHTML=`<h3>${i<0?'Add':'Edit'} · ${titles[k][0]}</h3>${d.c.map((c,j)=>`<label>${c}</label>${j==d.c.length-1?`<select><option>Active</option><option>Hidden</option></select>`:`<input value="${r[j]}">`}`).join('')}<label>Images / media</label><div class="lg">＋</div><label>SEO title · URL · description</label><input placeholder="Title"><input placeholder="/slug" style="margin-top:6px"><div class="bar" style="margin-top:18px"><button class="b p" onclick="sv('${k}',${i})">Save</button><button class="b" onclick="cl()">Cancel</button></div>`;$('#dr').classList.add('o')}
const cl=()=>$('#dr').classList.remove('o');
function sv(k,i){const v=[...$('#dr').querySelectorAll('input:not([placeholder]),select')].map(x=>x.value);if(i<0)D[k].r.unshift(v);else D[k].r[i]=v;audit((i<0?'Created ':'Updated ')+v[0]);toast('Saved');cl();go(cur)}
const V={
pay:()=>`<div class="g">${[['bKash','Tokenised checkout',1],['Nagad','Merchant gateway',1],['Rocket / Upay','Via aggregator',0],['SSLCommerz','Cards · net banking · EMI · MFS',1],['aamarPay','Alternate aggregator',0],['ShurjoPay','Alternate aggregator',0]].map((p,i)=>`<div class="card st" style="--i:${i}"><div class="bar" style="justify-content:space-between;margin:0"><b>${p[0]}</b>${tg(p[2])}</div><span>${p[1]}</span><label>Mode</label><select><option>Sandbox</option><option>Live</option></select><label>Store / App key</label><input value="••••••••••" onchange="audit('${p[0]} key changed')"><label>Secret (write-only)</label><input type="password" placeholder="Enter new secret"><label>Webhook / IPN URL</label><input readonly value="https://gadgetsite.com/webhooks/payments/${p[0].split(' ')[0].toLowerCase()}"><div class="bar" style="margin-top:12px"><button class="b" onclick="toast('${p[0]}: connection OK')">Test connection</button><button class="b p" onclick="audit('${p[0]} saved');toast('Saved')">Save</button></div></div>`).join('')}</div><div class="g g2"><div class="card"><h3>Cash on delivery rules</h3>${['Require phone OTP','Allow COD in Dhaka','Allow COD outside Dhaka'].map(x=>`<div class="li">${x}${tg(1)}</div>`).join('')}<label>Max COD order value ৳</label><input value="150000"><label>Required advance / booking %</label><input value="0"><label>COD fee ৳</label><input value="0"></div><div class="card"><h3>Fees & refunds</h3><label>Card gateway fee % (pass to customer)</label><input value="2.56"><label>Fee payer</label><select><option>Customer</option><option>Store</option></select><label>Refund SLA (days): bank / MFS / EMI / COD</label><input value="3 / 7–15 / 7–15 / 3"><h3 style="margin-top:14px">Reconciliation</h3><div class="li">Today: 86 paid · 3 pending · 2 failed <span class="ch ok" style="margin-left:auto">Matched</span></div><button class="b">Download daily report</button></div></div>`,
ship:()=>`<div class="g">${[['Pathao Courier','Nationwide + Dhaka express',1,'94%'],['Steadfast','Nationwide COD',1,'91%'],['RedX','Hub network',1,'89%'],['Paperfly','Fallback',0,'—'],['eCourier','Fallback',0,'—'],['Own riders','Dhaka 4-hour express',1,'97%']].map((c,i)=>`<div class="card st" style="--i:${i}"><div class="bar" style="justify-content:space-between;margin:0"><b>${c[0]}</b>${tg(c[2])}</div><span>${c[1]} · success rate ${c[3]}</span><label>API key / client ID</label><input value="••••••••••"><label>Secret (write-only)</label><input type="password" placeholder="Enter new secret"><label>Mode</label><select><option>Sandbox</option><option>Live</option></select><div class="bar" style="margin-top:12px"><button class="b" onclick="toast('${c[0]}: connection OK')">Test</button><button class="b p" onclick="audit('${c[0]} saved');toast('Saved')">Save</button></div></div>`).join('')}</div><div class="card"><h3>Courier rules (first match wins, then fallback)</h3><table><tr><th>Zone</th><th>Weight kg</th><th>COD max ৳</th><th>Priority</th><th>Base ৳</th></tr>${[['Dhaka express','0–5','150,000','Own riders → Pathao','150'],['Dhaka city','0–5','150,000','Pathao → Steadfast','60'],['Outside Dhaka','0–5','100,000','Steadfast → RedX → Pathao','120'],['Heavy (TV)','5–30','—','RedX → Steadfast','350']].map((r,i)=>`<tr style="--i:${i}">${r.map(x=>`<td><input value="${x}" onchange="audit('Courier rule')"></td>`).join('')}</tr>`).join('')}</table><button class="b" onclick="audit('Rule added')">+ Add rule</button></div><div class="g g2"><div class="card"><h3>Book parcels</h3><div class="li">#10481 Nusrat · Dhaka · COD ৳24,990 <button class="b p" style="margin-left:auto" onclick="toast('Booked with Pathao · PC-84720193');audit('Courier booked #10481')">Book</button></div><div class="li">#10479 Rahim · Chattogram <button class="b p" style="margin-left:auto" onclick="toast('Booked with Steadfast');audit('Courier booked #10479')">Book</button></div><button class="b">Bulk book + print labels</button></div><div class="card"><h3>COD settlement</h3><table><tr><th>Courier</th><th>Collected</th><th>Remitted</th><th>Status</th></tr><tr><td>Pathao</td><td>৳412,000</td><td>৳412,000</td><td>${chip('Active')}</td></tr><tr><td>Steadfast</td><td>৳268,500</td><td>৳240,000</td><td>${chip('Refund')}</td></tr></table></div></div>`,
dash:()=>`<div class="g">${[['Sales today',1240000,'৳'],['New orders',86,''],['Low stock',14,''],['Pre-orders',9,'']].map((s,i)=>`<div class="card st" style="--i:${i}"><span>${s[0]}</span><b data-n="${s[1]}" data-p="${s[2]}">0</b></div>`).join('')}</div><div class="g g2"><div class="card"><h3>Sales · last 7 days</h3><div class="bars">${[40,62,55,80,70,96,88].map((h,i)=>`<div style="height:${h}%;--i:${i}" title="৳${h}k"></div>`).join('')}</div></div><div class="card"><h3>Needs attention</h3>${['Refund requested #10480 (SLA 3d)','Galaxy S26 Ultra out of stock','Hero banner expires today','9 pre-order requests'].map(t=>`<div class="li">${t}</div>`).join('')}</div></div>`,
site:()=>`<div class="g g2"><div class="card"><h3>Brand</h3><label>Site name</label><input value="gadgetsite" oninput="audit('Site name')"><label>Logo (SVG/PNG) — updates header, footer, ribbon, About, emails</label><div style="display:flex;gap:12px;align-items:center"><div class="lg" id="lp">＋</div><input type="file" accept="image/*" onchange="const f=this.files[0];if(f){lp.innerHTML='<img src='+URL.createObjectURL(f)+'>';audit('Logo uploaded');toast('Logo updated')}"></div><label>Dark-mode logo · Favicon · Share image</label><input type="file"><h3 style="margin-top:18px">Theme colours</h3><div class="g">${[['Accent','--sand','#d2a679'],['Page','--bg','#23201d'],['Panel','--pn','#2e2a26']].map(c=>`<div><label>${c[0]}</label><input type="color" value="${c[2]}" oninput="document.documentElement.style.setProperty('${c[1]}',this.value);audit('Theme ${c[0]}')"></div>`).join('')}</div></div><div class="card"><h3>Motion (live demo)</h3>${[['Hero hold (ms)','hc',4850,2000,9000],['Hero slide (ms)','hs',280,100,1200],['Ribbon speed (px/s)','rs',78,20,200],['Dropdown wipe (ms)','wp',200,50,600]].map(m=>`<label>${m[0]}: <b id="${m[1]}v">${m[2]}</b></label><input type="range" id="${m[1]}" min="${m[3]}" max="${m[4]}" value="${m[2]}" oninput="${m[1]}v.textContent=this.value;audit('Motion ${m[0]}')">`).join('')}<div class="dm"><div id="demo"></div></div><p class="sub">The bar above uses your hold and slide values.</p></div></div>`,
home:()=>`<div class="card"><h3>Sections (drag to reorder)</h3>${lst(['Hero slider','Categories','Flash Sale (countdown)','Promo banners','Trending Now','Clip to Cart','Shop by Brand','New Arrivals','Most Popular','Hot Deal of the Day','Feature Products','Latest Blog','Trust badges','SEO text blocks'])}</div><div class="g g2"><div class="card"><h3>Selected block</h3><label>Data source</label><select><option>Newest</option><option>Best seller</option><option>Category…</option><option>Manual pick</option></select><label>Item count</label><input type="number" value="10"><label>Schedule start / end</label><input type="datetime-local"><input type="datetime-local" style="margin-top:6px"></div><div class="card"><h3>Visibility & history</h3><div class="li">Desktop ${tg(1)}</div><div class="li">Mobile ${tg(1)}</div><button class="b">Version history</button> <button class="b p" onclick="toast('Scheduled')">Schedule publish</button></div></div>`,
ban:()=>`<div class="g">${['Stock Clearance','Bangla guarantee','Most Wanted','Official Product'].map((n,i)=>`<div class="card"><div class="lg" style="width:100%;height:90px">Hero ${i+1}</div><label>Headline</label><input value="${n}"><label>Link</label><input value="/category/phones"><label>Start · end</label><input type="datetime-local"></div>`).join('')}</div><div class="card"><h3>Ribbon messages (marquee)</h3>${lst(['Welcome to gadgetsite Commerce','Mega Sale – up to 70% off','Free delivery above ৳999','Download the app','Secure payment with bKash, Nagad & Cards'])}</div>`,
menu:()=>`<div class="g g2"><div class="card"><h3>Header links</h3>${lst(['Brand','Online Exclusive','Offer','Pre-Order'])}</div><div class="card"><h3>Menu row</h3>${lst(['Phones','Tablet','Laptop','Smart Watch','Gadget','Accessories','Sounds','Smart TV','Home Appliance','Monitor'])}</div><div class="card"><h3>Footer · Company</h3>${lst(['About Us','Career','Our Brand','Blogs','Trade In'],0)}</div><div class="card"><h3>Branches</h3>${lst(['Branch 1: Jamuna Future Park','Branch 2: West Court','Branch 3: Finlay Square'],0)}</div></div>`,
pages:()=>`<div class="sp"><div class="card">${['Refund Policy','EMI Policy','Warranty','Exchange','Delivery','Privacy','Terms','About Us'].map((p,i)=>`<div class="ni ${i?'':'on'}" onclick="$$('.sp .ni').forEach(x=>x.classList.toggle('on',x===this));ed.innerHTML='<h3>${p}</h3><p>Edit ${p} content here.</p>'">${p}</div>`).join('')}</div><div class="card"><div class="bar"><button class="b p">English</button><button class="b">বাংলা</button></div><div class="tb">${[['B','bold'],['I','italic'],['•','insertUnorderedList'],['H','formatBlock']].map(t=>`<button class="b" onmousedown="event.preventDefault();document.execCommand('${t[1]}',false,'h3')">${t[0]}</button>`).join('')}</div><div class="ed" id="ed" contenteditable oninput="audit('Edited page')"><h3>Refund Policy</h3><p>Bank transfer: 3 working days · MFS: 7–15 · EMI: 7–15 · COD: 3.</p></div><div class="bar" style="margin-top:12px"><button class="b p" onclick="audit('Saved page');toast('Saved')">Save</button></div></div></div>`,
emi:()=>`<div class="card"><h3>Bank rates (%) — N/A where a tenure is unavailable</h3><table class="mx"><tr><th style="text-align:left">Bank</th><th>Min ৳</th>${[3,6,9,12,18,24,36].map(t=>`<th>${t}m</th>`).join('')}</tr>${['AB Bank','Brac Bank','City Bank','Prime Bank'].map(b=>`<tr><td style="text-align:left">${b}</td><td><input value="5000" style="width:70px"></td>${['4.499','5.999','8.499','9.99',b=='Prime Bank'?'N/A':'14.99',b=='Prime Bank'?'N/A':'18.999',b=='Prime Bank'?'N/A':'22.999'].map(v=>`<td><input value="${v}" style="width:68px" onchange="audit('EMI rate')"></td>`).join('')}</tr>`).join('')}</table><button class="b" onclick="audit('EMI bank added')">+ Add bank</button></div><div class="g g2"><div class="card"><h3>Gateway fees</h3><label>QR/Link VISA·MC %</label><input value="2.04"><label>AMEX %</label><input value="3.63"><label>Website direct %</label><input value="2.56"></div><div class="card"><h3>Payment methods</h3>${['Cash on delivery','bKash','Nagad','Cards (SSLCommerz)','Bank transfer'].map(p=>`<div class="li">${p}${tg(1)}</div>`).join('')}</div></div>`,
users:()=>`<div class="card"><h3>Permissions</h3><table class="mx"><tr><th style="text-align:left">Role</th>${['Catalog','Orders','Content','Marketing','Settings'].map(m=>`<th>${m}</th>`).join('')}</tr>${[['Super Admin',1,1,1,1,1],['Catalog Manager',1,0,0,0,0],['Content Editor',0,0,1,0,0],['Support',0,1,0,0,0],['Marketing',0,0,1,1,0]].map(r=>`<tr><td style="text-align:left">${r[0]}</td>${r.slice(1).map(x=>`<td><input type="checkbox" style="width:auto" ${x?'checked':''} onchange="audit('Permission changed')"></td>`).join('')}</tr>`).join('')}</table></div><div class="card"><h3>Audit log</h3><div id="al"></div></div>`,
set:()=>`<div class="g g2"><div class="card"><h3>Delivery</h3><label>Free delivery above ৳</label><input value="999"><label>Dhaka express (hours)</label><input value="4"><label>Standard (days)</label><input value="1–3"></div><div class="card"><h3>Store</h3>${['Maintenance mode','Show stock count','Allow pre-orders','Enable reviews','Cookie banner'].map((s,i)=>`<div class="li">${s}${tg(i>0)}</div>`).join('')}<label>Support phone</label><input value="09638001122"></div></div>`};
function go(k){cur=k;$$('.ni[data-k]').forEach(n=>n.classList.toggle('on',n.dataset.k==k));$('#v').style.animation='none';$('#v').offsetHeight;$('#v').style.animation='';sb.classList.remove('o');
$('#v').innerHTML=`<h1>${titles[k][0]}</h1><p class="sub">${titles[k][1]}</p><div class="sk"></div><div class="sk" style="width:70%"></div>`;
setTimeout(()=>{$('#v').innerHTML=`<h1>${titles[k][0]}</h1><p class="sub">${titles[k][1]}</p>`+(V[k]?V[k]():tbl(k));dnd();$$('[data-n]').forEach(e=>{const n=+e.dataset.n,t=performance.now();(function f(x){const p=Math.min((x-t)/900,1);e.textContent=e.dataset.p+Math.round(n*(1-Math.pow(1-p,3))).toLocaleString('en-IN');if(p<1)requestAnimationFrame(f)})(t)});if(k=='users')al.innerHTML=AL.length?AL.map(a=>`<div class="li">${a[0]} · ${a[1]} · ${a[2]}</div>`).join(''):'<p class="sub">No changes yet. Edit anything and it appears here.</p>';if(k=='site')demoRun()},350)}
let dt;function demoRun(){clearInterval(dt);let s=0;const run=()=>{const d=$('#demo');if(!d)return clearInterval(dt);const sl=+$('#hs').value;d.style.transition=`transform ${sl}ms cubic-bezier(.22,.8,.2,1)`;d.style.transform=(s^=1)?'translateX(66%)':'none'};dt=setInterval(run,+$('#hc').value/2);run()}
sb.innerHTML=`<div class="brand" id="bn">gadgetsite<small>Admin panel</small></div>`+NAV.map(g=>`<div class="gh">${g[0]}</div>`+g[1].map(i=>`<div class="ni" data-k="${i[0]}" onclick="go('${i[0]}')"><i>${i[2]}</i>${i[1]}</div>`).join('')).join('');
$('#pb').onclick=()=>{if(!pend)return toast('Nothing to publish');toast(pend+' changes published · cache revalidated');pend=0;$('#pc').textContent=0};
$('#pv').onclick=()=>toast('Opening storefront preview');addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='k'){e.preventDefault();$('#gs').focus()}if(e.key=='Escape')cl()});
go('dash');
</script></body></html>
